<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPG 5 – Lebensraum Erde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@700;800;900&display=swap">
<style>
  /* Stil wie die Canva-Präsentationen (GPG_Masterfolie): cremefarbener Grund, Cinzel-Versalien, goldener Strich, rostrote Kennzeichnung */
  :root{--paper:#f4ede4;--card:#fffaf3;--ink:#3f3a34;--muted:#7a6f62;--line:#e4d8c8;--gold:#e8a33d;--rust:#c0573e;--hint:#fbe6c8;
    --display:"Cinzel",Georgia,serif;--body:"Nunito","Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:700}
  .wrap{max-width:1040px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px 24px;margin-bottom:22px}
  .books{width:170px;display:block;margin-bottom:12px;mix-blend-mode:multiply}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,6vw,3.4rem);line-height:1.08;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
  .bar{width:70px;height:5px;border-radius:3px;background:var(--gold);margin:16px 0 12px}
  .kicker{color:var(--rust);font-weight:900;font-size:1.05rem}
  .sub{color:var(--muted);margin:6px 0 0;font-size:1rem}
  .globe{width:clamp(160px,30vw,320px);display:block;mix-blend-mode:multiply}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  a.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:14px 16px;transition:transform .12s,box-shadow .12s,border-color .12s}
  a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 20px rgba(63,58,52,.12);outline:none}
  .num{flex:0 0 auto;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-size:32px;line-height:1}
  .nr{font-size:.8rem;font-weight:900;letter-spacing:.06em;color:var(--rust);text-transform:uppercase}
  .title{font-size:1.08rem;font-weight:900;line-height:1.25}
  .go{font-size:.85rem;color:var(--muted);margin-top:2px}
  a.card.test{background:var(--hint);border-color:#f0cfa0}
  a.card.test .num{background:#fff4e2;border-color:#f0cfa0}
  a.card.soon{pointer-events:none;opacity:.5}
  footer{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:.9rem;margin-top:26px;text-align:center}
  footer img{width:36px;mix-blend-mode:multiply}
  @media (max-width:560px){header{grid-template-columns:1fr}.globe{width:170px;justify-self:center;grid-row:1}}
  @media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
